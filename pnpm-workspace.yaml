packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  # postinstall only checks for the native binary (installed via optionalDependencies)
  # and falls back to downloading a wasm build; not needed.
  '@swc/core': false
  esbuild: true
  prisma: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.9'
  - '@turbo/darwin-arm64@2.11.9'
  - '@turbo/linux-64@2.11.9'
  - '@turbo/linux-arm64@2.11.9'
  - '@turbo/windows-64@2.11.9'
  - '@turbo/windows-arm64@2.11.9'
  - turbo@2.11.9
# @nestjs/platform-fastify require()s @fastify/static (used by Swagger UI) without
# declaring it; expose it as an optional peer so pnpm links the backend's copy.
packageExtensions:
  '@nestjs/platform-fastify':
    peerDependencies:
      '@fastify/static': '*'
    peerDependenciesMeta:
      '@fastify/static':
        optional: true
